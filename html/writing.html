<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Writings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="nav">
      <a href="/index.html" class="nav-home" aria-label="Home">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 11.5 12 4l9 7.5"></path>
          <path
            d="M5.5 10v9.5a1 1 0 0 0 1 1H9.5v-6h5v6H17.5a1 1 0 0 0 1-1V10"
          ></path>
        </svg>
      </a>

      <div data-include="/html/navbar.html"></div>
    </header>

    <main>
      <section class="writing">
        <h1>Writings</h1>
        <p>
          Here I will put up some of my writings on philosophy, science,
          geography, and travel. I will also be putting up some of my essays and
          other academic writings here. More to come!
        </p>
        <ul>
          <li>
            <a href="/html/writing/philosophy/pygmalion.html"
              >The Universe Conspiring and the Pygmalion Effect</a
            >
          </li>
        </ul>
      </section>
    </main>
    <div data-include="/html/footer.html"></div>

    <script>
      Promise.all(
        [...document.querySelectorAll("[data-include]")].map(async (el) => {
          const response = await fetch(el.dataset.include);

          if (!response.ok) {
            throw new Error(`Failed to load ${el.dataset.include}`);
          }

          el.innerHTML = await response.text();
        }),
      )
        .then(() => {
          const script = document.createElement("script");
          script.src = "/main.js";
          document.body.appendChild(script);
        })
        .catch(console.error);
    </script>
  </body>
